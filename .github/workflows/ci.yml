name: MoonArch CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install latest stable MoonBit
        uses: hustcer/setup-moonbit@v1
        with:
          version: latest
          setup-core: true
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --target native --deny-warn
      - name: Build
        run: moon build --target native --deny-warn
      - name: Test
        run: moon test --target native --deny-warn
      - name: Validate offline demo configuration
        run: moon run cmd/main --target native -- config validate --config examples/offline/moonarch.json
      - name: Verify expected offline policy failure
        shell: bash
        run: |
          set +e
          moon run cmd/main --target native -- check --config examples/offline/moonarch.json --graph examples/offline/graph.json
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify baselined offline report
        run: moon run cmd/main --target native -- check --config examples/offline/moonarch-baselined.json --graph examples/offline/graph.json --format json --output _build/ci-report.json
      - name: Verify report output failures
        shell: bash
        run: |
          output_dir=_build/moonarch-report-parent
          test ! -e "$output_dir"
          set +e
          moon run cmd/main --target native -- check --config examples/offline/moonarch.json --graph examples/offline/graph.json --format json --output "$output_dir/report.json"
          status=$?
          set -e
          test "$status" -eq 3
          test ! -e "$output_dir"
      - name: Verify live Moon tree adapter
        run: moon run cmd/main --target native -- check --config examples/workspace/moonarch.json --workspace examples/workspace --format markdown --output _build/live-report.md
      - name: Check the live demo module
        working-directory: examples/workspace
        run: |
          moon check --target native --deny-warn
          moon build --target native --deny-warn
